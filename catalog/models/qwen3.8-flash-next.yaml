id: qwen3.8-flash-next
display_name: Qwen3.8 Flash Next
hf_repo: Qwen/Qwen3.8-Flash-Next
hf_revision: 812d96e10a0dd82b69d749e68693698cf6c36daa
verified_on: "2026-11-12"

architecture:
  status: verified
  source: https://huggingface.co/Qwen/Qwen3.8-Flash-Next/blob/812d96e10a0dd82b69d749e68693698cf6c36daa/config.json
  note: "n_shared_experts = 1 est déduit de shared_expert_intermediate_size (convention Qwen MoE) ; le reste est recopié de config.json."
  hf_architecture: Qwen4ExpForConditionalGeneration
  model_type: qwen4_exp
  family: moe
  attention: [linear_gated_deltanet, sparse_qsa, gqa]
  num_hidden_layers: 48
  hidden_size: 2560
  num_attention_heads: 24
  num_key_value_heads: 2
  head_dim: 256
  max_position_embeddings: 262144
  moe: {n_routed_experts: 512, num_experts_per_tok: 10, n_shared_experts: 1}
  raw:
    full_attention_interval: 4
    full_attention_layers: 12
    linear_attention_layers: 36
    linear_num_key_heads: 16
    linear_num_value_heads: 48
    linear_key_head_dim: 128
    linear_value_head_dim: 128
    linear_conv_kernel_dim: 4
    mamba_ssm_dtype: float32
    indexer_budget: 2048
    indexer_compress_ratio: 4
    shared_expert_intermediate_size: 640
    mtp_num_hidden_layers: 1

weights:
  status: verified
  source: "API Hugging Face, somme des fichiers .safetensors à la révision épinglée"
  checkpoint_bytes: 360000192888
  quantization: "bf16 (pas de quantization_config) ; checkpoint FP8 séparé : Qwen/Qwen3.8-Flash-Next-FP8 (172,78 Gio selon la recette)"

kv_cache:
  status: unverified
  source: "Calcul à partir de config.json (formules ci-dessous), non confronté à des logs vLLM"
  bytes_per_token: 12288
  bytes_per_token_dtype: fp8
  replicated_across_tp: false
  per_sequence_state_bytes: 115458048
  method: >-
    Attention complète : 2 (K, V) × 12 couches × 2 têtes KV × 256 × 1 octet (fp8) = 12 288 o/token, divisé par
    min(TP, 2) par GPU. État Gated DeltaNet par séquence : 36 couches × (48 × 128 × 128 × 4 o d'état SSM fp32
    + (2 × 16 × 128 + 48 × 128) × 3 × 2 o d'état de convolution) = 115 458 048 o. Ignore le cache de l'indexeur
    QSA et l'alignement des pages Mamba de vLLM : estimation basse, à remplacer par les logs.
  recommended_dtype: fp8
  recommended_dtype_status: verified
  recommended_dtype_source: "https://recipes.vllm.ai/Qwen/Qwen3.8-Flash-Next (« --kv-cache-dtype fp8 »)"

block_size:
  status: unverified
  source: "Recette vLLM : aucune taille de bloc indiquée"
  forced_by_backend: null
  note: "Modèle hybride : vLLM aligne la taille de bloc sur la page de l'état Mamba. Lire « kv cache block size » dans les logs."

speculative:
  status: verified
  source: https://recipes.vllm.ai/Qwen/Qwen3.8-Flash-Next
  native_method: mtp
  recommended_num_speculative_tokens: 3
  fixed_k: false
  note: "Réduire num_speculative_tokens sous 3 en cas de pression mémoire (recette)."

serving:
  status: verified
  source: https://recipes.vllm.ai/Qwen/Qwen3.8-Flash-Next
  min_vllm_version: "0.30.0"
  requires_custom_image: null
  note: "« Stable ≥0.30.0 runs the model, but this recipe is tuned and verified on nightly »."


performance:
  status: verified
  source:
    - "https://huggingface.co/Qwen/Qwen3.8-Flash-Next (model card à la révision épinglée : « 125B with 6B activated, plus 51B n-gram embedding and 4B MTP »)"
    - "config.json à la révision épinglée (moe_intermediate_size 640, num_experts 512, 10 actifs)"
  method: "Experts routés : 48 × 512 × 3 × 2560 × 640 ≈ 120,8 G paramètres, en BF16 (2 o par paramètre). Les tables n-gram sont des lookups, exclues."
  active_params_per_output_token: 6.0e9
  moe_layers: 48
  moe_intermediate_size: 640
  routed_expert_bytes_per_param: 2.0
  dense_bytes_per_param: 2.0
  compute_dtype: bf16


context_extension:
  status: verified
  source: "https://huggingface.co/Qwen/Qwen3.8-Flash-Next (model card à la révision épinglée, « Processing Ultra-Long Texts »)"
  method: yarn
  native_max_model_len: 262144
  max_model_len: 1000000
  # Chemin de l'override dans config.json, et bloc complet à passer : vLLM remplace rope_parameters en bloc.
  override_path: [text_config, rope_parameters]
  rope_parameters:
    mrope_interleaved: true
    mrope_section: [11, 11, 10]
    rope_type: yarn
    rope_theta: 10000000
    partial_rotary_factor: 0.25
    original_max_position_embeddings: 262144
  note: >-
    YaRN statique : le facteur s'applique quelle que soit la longueur, ce qui peut dégrader les textes courts. La model
    card conseille de n'activer l'extension que si nécessaire et d'ajuster factor à la longueur visée (2,0 pour
    524 288, 4,0 pour 1 000 000).

notes:
  - "Recette vLLM : sur 4× GB300, TEP4 (--enable-expert-parallel) est recommandé ; l'expert parallelism est « consistently faster » que TP4 seul."
  - "Recette vLLM : --attention-config.indexer_kv_dtype fp8 en plus de --kv-cache-dtype fp8."
  - "Recette vLLM : laisser --gpu-memory-utilization non défini sauf GPU partagé (KV dimensionné après le warmup)."
  - "Recette vLLM : en cas d'erreur de capacité du cache Mamba au démarrage, garder --max-num-seqs 256."
  - "Contexte natif 262 144 ; 1M via YaRN en opt-in (--hf-overrides), qualité à évaluer."
