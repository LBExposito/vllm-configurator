weights:
  status: verified
  source: "API Hugging Face, somme des fichiers .safetensors à la révision épinglée"
  checkpoint_bytes: 328337455672
  quantization: "fp8 e4m3, weight_block_size 128×128"

kv_cache:
  status: unverified
  source: https://recipes.vllm.ai/zai-org/GLM-5.3-Flash
  bytes_per_token: null
  bytes_per_token_dtype: null
  replicated_across_tp: null
  per_sequence_state_bytes: null
  method: >-
    Non chiffré : 11 couches MLA sparse (latent kv_lora_rank 512, sans RoPE) avec un indexeur kpool, et 34 couches
    d'attention linéaire KDA dont l'état par séquence dépend du dtype d'état retenu par vLLM. La disposition fp8 du
    latent sans RoPE n'est pas documentée. Seul repère publié (recette, AMD MI355X, TP4, FP8) : pool KV de
    14,92 M tokens, non transposable au B300. Fournir la valeur « GPU KV cache size » des logs.
  recommended_dtype: fp8

block_size:
  status: unverified
  source: "Recette vLLM : aucune taille de bloc pour NVIDIA (Ascend impose --block-size 512 à cause de l'indexeur kpool)"
  forced_by_backend: null
  note: "Modèle hybride : lire « kv cache block size » dans les logs."

speculative:
  status: verified
  source: https://recipes.vllm.ai/zai-org/GLM-5.3-Flash
  native_method: mtp
  recommended_num_speculative_tokens: 5
  fixed_k: false
  note: "k = 5 sur GB200 TP4 ; k = 3 pour le décodage « latency_specialized » sur 4× GB300 (au plus 7)."

serving:
  status: unverified
  source: https://recipes.vllm.ai/zai-org/GLM-5.3-Flash
  min_vllm_version: "0.29.0"
  requires_custom_image: null
  note: >-
    La recette affiche « vLLM 0.29.0+ » mais exige aussi une image avec le support natif de GLM5Next (#62424) et le
    binaire du frontend Rust correspondant. Présence de #62424 dans la 0.33.0 non vérifiée.

notes:
  - "Recette vLLM : --tokenizer-mode glm5_next, --tool-call-parser glm47, --reasoning-parser glm47."
  - "Recette vLLM : FlashInfer ≥ 0.6.17 requis pour la MLA sparse sans RoPE (la page cite aussi 0.6.18)."
  - "Recette vLLM : pas de consigne sur le prefix caching ; les benchmarks publiés sont « no prefix caching »."
  - "Recette vLLM : le frontend Rust ne prend pas encore en charge les entrées image et vidéo."
