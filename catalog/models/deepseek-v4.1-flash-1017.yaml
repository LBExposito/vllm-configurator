notes:
  - "Recette vLLM : la validation B300 a porté sur le checkpoint 0909, pas sur 1017."
  - "Recette vLLM : --kv-cache-dtype fp8 sur Blackwell ; préréglage B300 avec --max-cudagraph-capture-size 8190, --max-num-batched-tokens 8192 et --max-num-seqs 256 (k = 5)."
  - "Recette vLLM : le drafter ajoute environ 14 milliards de paramètres (experts) au chargement."
