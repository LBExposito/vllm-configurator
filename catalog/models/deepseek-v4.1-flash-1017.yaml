  per_sequence_state_bytes: null
  method: >-
    Valeur annoncée par DeepSeek (« 890 bytes per token » de KV global) et citée par la recette vLLM, à laquelle
    s'ajoute une fenêtre glissante fixe de 128 tokens par couche, non chiffrée. Non dérivable de config.json
    (compression par couche, KV partagé entre couches, indexeur, engram). Réplication sur les rangs TP déduite
    d'une seule tête KV. Préférer la valeur « GPU KV cache size » des logs de démarrage.
  recommended_dtype: fp8
  recommended_dtype_status: verified
  recommended_dtype_source: "https://recipes.vllm.ai/deepseek-ai/DeepSeek-V4.1-Flash-1017 (« --kv-cache-dtype fp8 » sur Blackwell) ; base de connaissances §5 (disposition fp8_ds_mla)"

block_size:
  status: verified
  source: >-
    Log de démarrage du cas de référence (vLLM 0.33.0, TP4 sur 4× B300) : « Setting kv cache block size to 128
    for FLASHMLA_MEGA_ATTN_DSV41/DEEPSEEK_SPARSE_SWA/DEEPSEEK_V41_INDEXER/CompressorBackend »
  forced_by_backend: 128
  note: "Imposée par le backend d'attention : ne pas passer --block-size."

speculative:
  status: verified
  source:
    - "config.json (champs dspark_*)"
