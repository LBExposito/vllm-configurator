  native_method: dspark
  recommended_num_speculative_tokens: 5
  fixed_k: false
  note: >-
    La recette vLLM recommande k = 5 et indique que DSpark est la seule méthode de ce checkpoint (« the MTP module
    was dropped in V4.1 »), alors que config.json contient encore num_nextn_predict_layers = 3. Le cas de référence
    utilise k = 3.

serving:
