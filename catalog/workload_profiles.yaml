# Workload profiles, heuristics and metrics (docs/vllm-config-knowledge-base.md, §4, §5, §6, §10).
# status: verified = published and sourced data; unverified = heuristic or choice of the app, to validate in production.

profiles:
  chat:
    label: Chat classique
    isl_typical: "~1–6K"
    osl_typical: "~100–400"
    ratio_range: [4, 15]
    fills_16k: "Non"
    recommended_budget: 8192
    budget_range: [4096, 8192]
    source: "Base de connaissances §4"
    osl_per_call_median:
      value: 105
      status: verified
      source: "GitHub Copilot coding agent traces (Microsoft Research, 2026) : chat, sortie médiane ~105"
  agentic:
    label: Agentique multi-tours (type Cowork)
    isl_typical: "24–68K par appel"
    osl_typical: "~250 par appel"
    ratio_range: [12, 14]
    fills_16k: "Non (sauf rafales)"
    recommended_budget: 8192
    budget_range: [8192, 8192]
    source: "Base de connaissances §4 et §6"
    tool_calls: true
    reference_ratio:
      value: 12.5
      status: verified
      source: "TraceLab (UW, 2026) : 2,34 Md de tokens nouveaux / 186,9 M générés"
    prefix_cache_hit_rate:
      value: 0.957
      status: verified
      source: "TraceLab (UW, 2026) : hit rate global 95,7 %"
    osl_per_call_median:
      value: 247
      status: verified
      source: "GitHub Copilot coding agent traces (Microsoft Research, 2026) : sortie médiane par appel 247"
  rag:
    label: RAG / Q&A sur documents
    isl_typical: "16K"
    osl_typical: "~150–400"
    ratio_range: [40, 100]
    fills_16k: "Presque"
    recommended_budget: 8192
    budget_range: [8192, 16384]
    source: "Base de connaissances §4"
  extraction:
    label: Extraction / classification sur longs documents
    isl_typical: "32K"
    osl_typical: "~200–800"
    ratio_range: [40, 160]
    fills_16k: "Oui"
    recommended_budget: 16384
    budget_range: [16384, 32768]
    source: "Base de connaissances §4"
  long_summary:
    label: Résumé de très longs contextes
    isl_typical: "128K"
    osl_typical: "~1K"
    ratio_range: [128, 128]
    fills_16k: "Oui"
    recommended_budget: 16384
    budget_range: [16384, 32768]
    source: "Base de connaissances §4"
  scoring:
    label: Scoring, rerank, LLM-as-judge, prompt_logprobs
    isl_typical: "variable"
    osl_typical: "1–20"
    fills_16k: "Oui"
    recommended_budget: 16384
    budget_range: [16384, 32768]
    source: "Base de connaissances §4"
  batch_offline:
    label: Batch offline en rafale
    isl_typical: "—"
    osl_typical: "—"
    fills_16k: "Oui pendant le remplissage"
    recommended_budget: 16384
    budget_range: [16384, 32768]
    source: "Base de connaissances §4"

heuristics:
  max_num_seqs_start:
    value: {large_kv: 512, default: 256}
    status: unverified
    source: "Base de connaissances §5 : « Point de départ : 256–512 si le KV est large »"
  large_kv_min_concurrency:
    value: 1024
    status: unverified
    source: "Choix de l'app : le KV est « large » s'il loge au moins 1024 contextes P50 (2 × le point de départ haut)"
  long_prefill_threshold_divisor:
    value: 4
    status: unverified
    source: "Base de connaissances §2.5 et §5 : seuil ≈ budget / 4, soit ~4 prefills en parallèle en cas de contention"
  gpu_memory_utilization_large_capture:
    value: 0.8
    status: verified
    source: "Blog vLLM sur DSpark (base de connaissances §2.4) : 0,8 si la capture des CUDA graphs fait déborder la mémoire"
    note: >-
      « Grosse capture » = au-delà du plafond par défaut de vLLM pour la famille de GPU (1024 sur Blackwell datacenter,
      512 sinon). Ne s'applique que si vLLM ne profile pas la mémoire des CUDA graphs (comportement
      cudagraph.memory_profiling du catalogue de la version) : sinon la réserve serait comptée deux fois.
  assumed_acceptance_length:
    value: 3.0
    status: unverified
    source: "Base de connaissances §3.1 : scénarios a = 2,5 / 3,0 / 3,5 pour DSpark k = 3 ; valeur médiane retenue"
    note: "À remplacer par la mesure Prometheus a = 1 + spec_decode_num_accepted_tokens / spec_decode_num_drafts."
  osl_suspect_factor:
    value: 4
    status: unverified
    source: "Choix de l'app : OSL P50 suspect s'il dépasse 4 × la médiane publiée par appel pour ce type d'usage (§6)"
  isl_tail_ratio_warning:
    value: 5
    status: unverified
    source: "Choix de l'app : P99/P95 > 5 signale une queue à expliquer (mesure par appel ou cumul par tour, §6)"

  # --- SLO analysis (roofline latency model, src/vllm_configurator/perf.py) ---
  perf_hbm_efficiency:
    value: 0.6
    status: unverified
    source: >-
      Choix de l'app : fraction de la bande passante HBM nominale atteinte par les GEMM et l'attention en decode.
      0,6 plutôt que 0,7 : les GEMM groupées des experts MoE ne voient qu'une dizaine de lignes par expert en decode.
    note: "Ordre de grandeur. Saisir l'ITL p95 mesurée recalibre tout le modèle."
  perf_mfu:
    value: 0.4
    status: unverified
    source: "Choix de l'app : fraction du débit crête dense des tensor cores atteinte sur un step chargé en prefill"
  perf_overhead_per_layer_ms:
    value: 0.1
    status: unverified
    source: "Choix de l'app : coût fixe par couche et par step (lancements de kernels, latence des all-reduce TP, scheduler)"
    note: >-
      Domine à faible concurrence : c'est lui qui fixe le plancher d'ITL d'une séquence seule. Le volume des all-reduce,
      qui croît avec les tokens du step, est compté à part (perf_nvlink_efficiency).
  perf_mixed_step_overhead_factor:
    value: 1.5
    status: unverified
    source: >-
      Choix de l'app : un step mixte prefill + decode tourne en CUDA graphs par morceaux (attention hors graph), son
      coût fixe est plus élevé que celui d'un step de decode pur capturé en entier
  perf_overhead_per_seq_us:
    value: 8
    status: unverified
    source: "Choix de l'app : coût par séquence et par step (sampling sur tout le vocabulaire, rejection sampling, scheduler)"
  perf_nvlink_efficiency:
    value: 0.6
    status: unverified
    source: >-
      Choix de l'app : fraction du débit NVLink par sens (moitié du débit GPU à GPU bidirectionnel de la fiche GPU)
      atteinte par les all-reduce NCCL de taille moyenne
  perf_sparse_indexer_cost_ratio:
    value: 0.1
    status: unverified
    source: >-
      Choix de l'app : coût de l'indexeur d'une attention sparse, par token de contexte, rapporté à une paire
      (requête, clé) d'attention complète. Ordre de grandeur de DSA (DeepSeek V3.2 : indexeur à 64 têtes de 128 en
      FP8, QK seul, face à une attention MLA de 64 têtes de 576)
  perf_drafter_step_fraction:
    value: {parallel: 0.15, autoregressive_per_token: 0.08}
    status: unverified
    source: >-
      Choix de l'app : coût de la passe du drafter rapporté à un step de decode du modèle cible. Drafter parallèle
      (DSpark, DFlash) : une passe par step ; drafter autorégressif (MTP, EAGLE, draft model) : k passes. ngram : nul
  frontend_python:
    value:
      network_ms: 10
      request_loop_ms: 1.5
      parse_loop_ms_per_1k_tokens: 0.05
      template_ms_per_1k_tokens: 0.15
      tokenize_ms_per_1k_tokens: 0.5
      tokenize_gil_share: 0.1
      output_chunk_us: 60
      utilization_max: 0.7
      cores_engine_core: 1
      cores_per_gpu_worker: 1
    status: unverified
    source: >-
      Choix de l'app : coûts CPU du frontend Python de `vllm serve`, par processus API. Hors CPU du pod : réseau et
      EPP (network_ms, TTFT seulement). Sur la boucle asyncio : HTTP, validation et routage par requête
      (request_loop_ms), décodage JSON de l'historique de messages (~4 caractères par token). Sur le pool du renderer :
      chat template (Python, tient le GIL) et tokenisation (tokenizer rapide, ~2 M tokens/s par thread). Le cœur Rust
      de la tokenisation tourne hors GIL (vérifié : comportement frontend.renderer_pool) ; la conversion du résultat
      en listes Python le garde, part supposée à 10 % (tokenize_gil_share). Par séquence et par step, sur la boucle :
      détokenisation, delta de streaming, parseurs de raisonnement et
      de tool calls, SSE (output_chunk_us). Au-delà de 70 % d'occupation d'un GIL ou du pool, l'attente explose.
      Hors frontal : l'engine core (boucle active, ~1 cœur) et un processus worker par GPU (~1 cœur chacun)
    note: >-
      Mesure : CPU de chaque processus API (top -H, pidstat), py-spy dump pendant un palier ; un processus API à ~100 %
      d'un cœur et un écart client/serveur sur le TTFT et l'ITL qui grandit avec la charge signalent un frontal saturé.
      Frontend Rust (VLLM_USE_RUST_FRONTEND=1) non modélisé.
  slo_margin:
    value: {ok_below: 0.85, ko_above: 1.15}
    status: unverified
    source: "Choix de l'app : une estimation à ±15 % de la cible est classée « à risque », faute de précision du modèle"
  cold_request_fraction:
    value: {value: 0.05, max_share_of_uncached_tokens: 0.5}
    status: unverified
    source: >-
      Choix de l'app : 5 % de requêtes au préfixe absent du cache (premier appel d'une session d'une vingtaine d'appels,
      évictions, mauvais routage), prefillées en entier. Plafond : leur prefill ne dépasse pas la moitié du prefill
      non caché qu'implique le hit rate (sinon le hit rate déclaré serait intenable)
    note: "Mesure : part des requêtes sans prefix cache hit. Saisie possible dans le formulaire (Part de requêtes froides)."
  uncached_tokens_sigma:
    value: 1.0
    status: unverified
    source: >-
      Choix de l'app : dispersion lognormale de la part non cachée d'un prompt chaud (sorties d'outils, messages
      utilisateur), qui fait la queue de la distribution des tokens à prefiller
  acceptance_dispersion:
    value: 8
    status: unverified
    source: >-
      Choix de l'app : concentration (alpha + beta) de la loi Beta du taux d'acceptation par requête (prose, code, JSON
      d'outils s'acceptent très différemment) ; fixe la longueur d'acceptation des 5 % de requêtes les moins acceptées
  perf_uncertainty:
    value: {uncalibrated: [0.8, 2.5], calibrated: [0.85, 1.15]}
    status: unverified
    source: >-
      Choix de l'app : plage multiplicative appliquée aux durées estimées. Sans mesure, le modèle reste un ordre de
      grandeur (rendements des kernels, coût réel de l'indexeur sparse et du drafter supposés) : de ×0,8 à ×2,5.
      Recalé sur une mesure : ±15 %, séparément pour la partie decode (latence de génération) et prefill (TTFT).
  test_plan_ladder:
    value: [16, 32, 64, 96, 128, 192, 256, 384, 512, 640, 768, 1024, 1280, 1536, 2048]
    status: unverified
    source: "Choix de l'app : valeurs de max-num-seqs proposées comme paliers (environ ×1,3 à ×1,5 entre deux paliers)"
  prefill_load_max:
    value: 0.8
    status: unverified
    source: "Choix de l'app : au-delà de 80 % de charge du budget de prefill, l'attente avant prefill explose (file M/G/c)"
  kv_usage_max:
    value: 0.9
    status: unverified
    source: "Choix de l'app : au-delà de 90 % d'occupation moyenne du KV, les pointes provoquent des préemptions"

metrics:
  - name: "vllm:iteration_tokens_total"
    usage: "Histogramme des tokens par step : le budget est-il rempli ?"
  - name: "prompt tokens non cachés / generation tokens (débits)"
    usage: "Ratio effectif réel ISL_eff/OSL, à comparer au ratio nécessaire (§3.1)"
  - name: "vllm:prefix_cache_hits / vllm:prefix_cache_queries"
    usage: "Hit rate par pod : cible > 90 % en agentique, sinon problème de routage ou d'éviction"
  - name: "TTFT p95 / ITL p95"
    usage: "Arbitrage du budget de tokens et de max_num_seqs"
  - name: "num_requests_running / num_requests_waiting, préemptions"
    usage: "Saturation du KV ou du compute"
  - name: "spec_decode_num_accepted_tokens / spec_decode_num_drafts"
    usage: "Longueur d'acceptation a = 1 + acceptés / drafts"
  - name: "vllm:cache_config_info (labels block_size, num_gpu_blocks)"
    usage: "Taille de bloc et nombre de blocs réels (lus par l'autoTune de l'EPP llm-d, v2)"

validation_tests:
  - >-
    Test du seuil de long prefill : ~100 sessions en decode en fond, puis 1 prompt non caché de 100K, puis
    immédiatement 5 à 10 prompts de 2K. Comparer le TTFT des petits prompts avec un seuil de 2048 puis de 4096.
