# vLLM 0.32.0 catalog (edited by hand).
# The exhaustive list of flags and JSON keys is in extracted/0.32.0.yaml (generated).
# status: verified = read in the source code at tag v0.32.0; unverified = 🔶 to verify.
version: "0.32.0"
source_tag: v0.32.0
verified_on: "2026-11-12"

# Default values used by the engine (for the « default → chosen » display).
defaults:
  gpu_memory_utilization:
    value: 0.92
    status: verified
    source: vllm/config/cache.py (CacheConfig.gpu_memory_utilization)
  max_num_seqs:
    value: null
    status: verified
    source: vllm/engine/arg_utils.py (--max-num-seqs, default=None, résolu selon le contexte d'usage)
    note: "Le défaut dépend du contexte d'usage et du matériel (EngineArgs.create_engine_config)."
  max_num_batched_tokens:
    value: null
    status: verified
    source: vllm/engine/arg_utils.py (--max-num-batched-tokens, default=None)
    note: "Le défaut dépend du contexte d'usage et du matériel (EngineArgs.create_engine_config)."
  long_prefill_token_threshold:
    value: 0
    status: verified
    source: vllm/config/scheduler.py (SchedulerConfig.long_prefill_token_threshold, 0 = désactivé)
  long_prefill_token_threshold_adaptive:
    value: false
    status: verified
    source: vllm/config/scheduler.py (SchedulerConfig.long_prefill_token_threshold_adaptive)
  enable_prefix_caching:
    value: true
    status: verified
    source: vllm/config/cache.py (CacheConfig.enable_prefix_caching)
  enable_chunked_prefill:
    value: true
    status: verified
    source: vllm/config/scheduler.py (SchedulerConfig.enable_chunked_prefill)
  kv_cache_dtype:
    value: auto
    status: verified
    source: vllm/config/cache.py (CacheConfig.cache_dtype)
  draft_sample_method:
    value: greedy
    status: verified
    source: vllm/config/speculative.py (SpeculativeConfig.draft_sample_method)
  rejection_sample_method:
    value: standard
    status: verified
    source: vllm/config/speculative.py (SpeculativeConfig.rejection_sample_method)
  enable_adaptive_verification:
    value: false
    status: verified
    source: vllm/config/speculative.py (SpeculativeConfig.enable_adaptive_verification)
  api_server_count:
    value: null
    status: verified
    source: "vllm/entrypoints/launchers/cli_args.py (--api-server-count, default=None) ; vllm/entrypoints/cli/serve.py (ServeSubcommand.cmd)"
    note: >-
      None : data_parallel_size (DP interne), 1 en DP externe ou multi-port, 1 avec le frontend Rust. Une instance DP1
      a donc un seul processus API par défaut.
  renderer_num_workers:
    value: 1
    status: verified
    source: vllm/config/model.py (ModelConfig.renderer_num_workers)

behaviors:
  max_model_len.yarn_factor_extends_derived:
    value: false
    status: verified
    source: "vllm/config/model.py au tag v0.32.0, _get_and_verify_max_len : rope_type yarn exclu du facteur (« YaRN variants leave max_position_embeddings already scaled »)"
    note: >-
      Avec un override YaRN, le max dérivé reste max_position_embeddings : un --max-model-len supérieur exige
      VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 (sinon ValueError au démarrage), ou un override de max_position_embeddings.
  max_model_len.allow_long_env:
    value: VLLM_ALLOW_LONG_MAX_MODEL_LEN
    status: verified
    source: "vllm/envs.py au tag v0.32.0 (VLLM_ALLOW_LONG_MAX_MODEL_LEN, « 1 » ou « true »)"
  hf_overrides.nested_merge:
    value: true
    status: verified
    source: "vllm/config/model.py au tag v0.32.0, _apply_dict_overrides : une clé dont la valeur est un sous-config (text_config) est fusionnée récursivement ; un dict ordinaire (rope_parameters) est remplacé en bloc"
  long_prefill.single_request_bypass:
    value: true
    status: verified
    source: "vllm/v1/core/sched/scheduler.py (schedule : seuil = 0 si running + waiting ≤ 1) ; PR #57951"
    note: "Une requête seule n'est jamais plafonnée par --long-prefill-token-threshold."
  long_prefill.adaptive_floor:
    value: opt_in
    status: verified
    source: "vllm/v1/core/sched/scheduler.py : seuil_effectif = max(seuil, max_num_batched_tokens // (running + waiting)) si --long-prefill-token-threshold-adaptive ; PR #58459"
    note: >-
      Le plafond dynamique de #58459 n'est PAS actif par défaut : il faut --long-prefill-token-threshold-adaptive.
      C'est un plancher (max), pas un plafond, et le diviseur compte toutes les requêtes running,
      decode compris.
  spec_decode.verification_tokens_in_budget:
    value: true
    status: verified
    source: "vllm/v1/core/sched/scheduler.py (num_new_tokens = num_tokens_with_spec - num_computed_tokens) ; PR #59468 (« charged 6 tokens instead of 10 » pour K=5)"
    note: "En decode, chaque séquence consomme 1 + k tokens du budget (tokens de vérification), quelle que soit la méthode."
  spec_decode.extra_draft_slots:
    # Extra slots reserved per request in the input budget, on top of 1 + k.
    value: {dspark: "k-1", dflash: "k", mtp: "0", eagle3: "0", eagle3_parallel: "k-1", draft_model: "1", pard: "k", ngram: "0"}
    status: verified
    source: "vllm/config/speculative.py (SpeculativeConfig.max_num_new_slots_for_drafting), avant la PR #59468"
  spec_decode.dspark_active_seq_cap:
    value: false
    status: verified
    source: "vllm/config/vllm.py (absent avant la PR #59468)"
  spec_decode.fly:
    value: {available: false}
    status: verified
    source: "vllm/config/speculative.py (RejectionSampleMethod sans 'fly' ; FLy arrive en 0.33, PR #53987)"
  spec_decode.adaptive_verification:
    value: {available: true, default: false, methods: [dspark]}
    status: verified
    source: "vllm/config/speculative.py (enable_adaptive_verification: « Currently only supported for method=dspark »)"
  spec_decode.draft_lm_head_quantization:
    value: {available: false}
    status: verified
    source: "vllm/config/speculative.py (champ absent ; arrive en 0.33, PR #59973)"
  cudagraph.default_max_capture_size:
    value: {blackwell_dc: 1024, other: 512, formula: "min(max_num_seqs × (k+1) × 2, plafond)"}
    status: verified
    source: "vllm/config/vllm.py (_set_cudagraph_sizes) ; vllm/config/compilation.py (max_cudagraph_capture_size)"
  cudagraph.capped_by_max_num_batched_tokens:
    value: true
    status: verified
    source: "vllm/config/vllm.py : max_cudagraph_capture_size = min(max_num_batched_tokens, max_cudagraph_capture_size)"
  cudagraph.multiple_of_k_plus_1:
    value: true
    status: verified
    source: "vllm/config/compilation.py (adjust_cudagraph_sizes_for_spec_decode)"
    note: "Avec spec decoding, les tailles de capture sont arrondies à un multiple de k + 1."
  cudagraph.memory_profiling:
    value: {enabled_by_default: true, disable_env: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS}
    status: unverified
    source: "Log de démarrage réel (vllm.v1.worker.gpu_worker) : « CUDA graph memory profiling is enabled (default since v0.21.0). The current --gpu-memory-utilization=0.8000 is equivalent to --gpu-memory-utilization=0.6708 without CUDA graph memory profiling »"
    note: "La mémoire des CUDA graphs est mesurée au profilage et retirée du budget de gpu-memory-utilization : baisser cette fraction pour protéger la capture compte la réserve deux fois. Relevé sur une instance 0.33 ; le message indique un défaut depuis 0.21.0, non relu au tag."
  frontend.rejects_unknown_flags:
    value: false
    status: unverified
    source: "Changement introduit en 0.33.0 (#62431) d'après les notes de version ; comportement antérieur non relu"

# Flags and JSON keys the engine can emit. Each name is validated against extracted/0.32.0.yaml.
  frontend.api_servers:
    value:
      default: data_parallel_size
      rust_frontend_enabled_by_default: false
      rust_frontend_forces_one: true
      incompatible_env: [VLLM_ALLOW_RUNTIME_LORA_UPDATING]
      elastic_ep_caps_to_one: true
      multiprocess_prometheus: true
    status: verified
    source: >-
      vllm/entrypoints/cli/serve.py au tag v0.32.0 (ServeSubcommand.cmd, run_multi_api_server) ; vllm/envs.py
      (VLLM_USE_RUST_FRONTEND, défaut 0)
    note: >-
      Frontend Python : N processus API sur un port partagé (reuse_port), chacun avec sa boucle asyncio, son GIL, son
      renderer et sa détokenisation ; un seul engine core. Frontend Rust (VLLM_USE_RUST_FRONTEND=1) : le flag est ignoré
      et ramené à 1 (frontend multithread).
  frontend.renderer_pool:
    value:
      default_workers: 1
      offloaded: [chat_template, tokenization, prompt_embeds]
      chat_template_offloaded_by: [hf, deepseek_v4]
      multimodal_single_worker: true
      output_processing: event_loop
    status: verified
    source: >-
      vllm/renderers/base.py (_executor = pool de renderer_num_workers threads, _mm_executor à 1 thread),
      vllm/renderers/hf.py et vllm/renderers/deepseek_v4.py (_apply_chat_template_async sur _executor),
      vllm/v1/engine/async_llm.py (output_handler : process_outputs sur la boucle asyncio), au tag v0.32.0
    note: >-
      Le pool ne sert que l'entrée (chat template, tokenisation) et seulement dans `vllm serve`. Le prétraitement
      multimodal reste sur un thread dédié ; la détokenisation et le streaming des sorties restent sur la boucle
      asyncio du processus API. Le chat template est du Python et tient le GIL (Jinja, ou encode_messages pour
      DeepSeek V4/V4.1 dans vllm/tokenizers/). La tokenisation passe par transformers TokenizersBackend._encode_plus
      → tokenizers encode_batch, dont le cœur Rust tourne hors GIL (py.allow_threads / py.detach) ; seules
      l'extraction du texte et la conversion du résultat en listes Python le gardent. Relu dans transformers 5.16.1 et tokenizers 0.23.2 et 0.23.3.
      Backend fastokens (VLLM_USE_FASTOKENS=1) non relu.

