[project]
name = "vllm-config"
version = "0.1.0"
description = "Générateur de configuration vLLM à partir du profil de charge, du matériel et du modèle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "streamlit>=1.38",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
